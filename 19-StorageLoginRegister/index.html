<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hesab Ayarları</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>



  <div class="container mt-5" style="max-width: 500px;">
    <span class="navbar-brand">Username: <span id="displayUsername"></span></span>
    <h2 class="mb-4 text-center">Hesab Ayarları</h2>
    <form id="settingsForm">
      <div class="mb-3">
        <label for="newUsername" class="form-label">Istifadəçi Adı</label>
        <input type="text" class="form-control" id="newUsername" required />
      </div>
      <div class="mb-3">
        <label for="newEmail" class="form-label">Email</label>
        <input type="email" class="form-control" id="newEmail" required />
      </div>
      <div class="mb-3">
        <label for="newPassword" class="form-label">Yeni Şifrə</label>
        <input type="password" class="form-control" id="newPassword" required />
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Yadda saxla</button>
      </div>
    </form>
  </div>
  <script
  type="text/javascript"
  src="https://cdn.jsdelivr.net/npm/toastify-js"
></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/script.js"></script>
</body>
</html>
